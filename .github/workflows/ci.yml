name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validator:
    name: SEO data compatibility tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run validator tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Compile validator
        run: python -m py_compile scripts/validate_seo_data.py
