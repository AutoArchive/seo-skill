name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Skills, templates, analyzers, and evals
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Validate skills
        run: python scripts/validate_skills.py

      - name: Test Markdown templates
        run: python scripts/test_templates.py

      - name: Validate evaluation cases
        run: python scripts/validate_evals.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
